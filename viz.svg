<text x="56.0" y="197.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">Map sorted-key → bucket: "aet" collects eat, tea, ate; "ant" collects tan, nat;</text>
<text x="56.0" y="216.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">"abt" collects bat. (A 26-count signature key avoids the per-word sort — O(k)</text>
<text x="56.0" y="235.0" font-family="-apple-system,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" fill="#1e293b" text-anchor="start">instead of O(k log k).)</text>
